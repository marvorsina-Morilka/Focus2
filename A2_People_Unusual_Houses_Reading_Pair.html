<script>
/* ============================================================
   LESSON DATA – edit only this object
   ============================================================ */
const lessonData = {
  title: "People who don’t live in traditional houses",
  level: "A2",
  age: 12,
  format: "pair",
  duration: 60,

  stages: [
    { id: "leadin", name: "Lead-in", aim: "Activate interest in unusual homes and discuss advantages/disadvantages.", time: "7 min" },
    { id: "vocab", name: "Vocabulary", aim: "Present and practise 20 key words about places and homes.", time: "10 min" },
    { id: "reading", name: "Reading", aim: "Read about five unusual ways of living and check understanding.", time: "12 min" },
    { id: "controlled", name: "Controlled Practice", aim: "Practise new vocabulary and reading details with accuracy.", time: "10 min" },
    { id: "semicontrolled", name: "Semi-controlled", aim: "Practise language in guided tasks.", time: "8 min" },
    { id: "production", name: "Free Practice", aim: "Speak freely about unusual homes and personal preferences.", time: "10 min" },
    { id: "summary", name: "Summary", aim: "Review key words and ideas.", time: "3 min" }
  ],

  vocab: [
    { word: "treehouse", def: "a house built in the branches of a tree", ex: "The Korowai people live in treehouses.", ua: "будиночок на дереві" },
    { word: "underground", def: "under the ground", ex: "They live in underground homes.", ua: "підземний" },
    { word: "volcano", def: "a mountain that can explode with fire and smoke", ex: "The island has an active volcano.", ua: "вулкан" },
    { word: "island", def: "a piece of land with water all around it", ex: "They live on a small island.", ua: "острів" },
    { word: "cave", def: "a large hole in a mountain or under the ground", ex: "People lived in caves long ago.", ua: "печера" },
    { word: "stilts", def: "long poles that hold a house above the water or ground", ex: "Their houses stand on stilts.", ua: "палі / стовпи" },
    { word: "rainforest", def: "a thick forest in a hot, wet place", ex: "The Korowai live in the rainforest.", ua: "тропічний ліс" },
    { word: "desert", def: "a very dry place with little rain", ex: "Coober Pedy is in the desert.", ua: "пустеля" },
    { word: "tribe", def: "a group of people who live together and share the same culture", ex: "The Korowai are a tribe in Indonesia.", ua: "плем’я" },
    { word: "traditional", def: "following old ways of doing things", ex: "They don’t live in traditional houses.", ua: "традиційний" },
    { word: "advantage", def: "something good about a situation", ex: "One advantage is the beautiful view.", ua: "перевага" },
    { word: "disadvantage", def: "something bad about a situation", ex: "A disadvantage is the cold weather.", ua: "недолік" },
    { word: "protect", def: "to keep safe from danger", ex: "The trees protect them from animals.", ua: "захищати" },
    { word: "material", def: "what something is made of", ex: "They use wood as building material.", ua: "матеріал" },
    { word: "ladder", def: "a thing with steps for climbing up", ex: "They use a ladder to get into the treehouse.", ua: "драбина" },
    { word: "view", def: "what you can see from a place", ex: "The view from the treehouse is amazing.", ua: "вид" },
    { word: "tourist", def: "a person who visits a place for pleasure", ex: "Many tourists visit Petra.", ua: "турист" },
    { word: "monument", def: "an old important building or structure", ex: "Petra has famous monuments.", ua: "пам’ятка" },
    { word: "dive", def: "to swim under the water", ex: "The Bajau people can dive very deep.", ua: "пірнати" },
    { word: "oxygen", def: "the gas we need to breathe", ex: "They can hold their breath and use less oxygen.", ua: "кисень" }
  ],

  reading: {
    title: "People who don’t live in traditional houses",
    houses: [
      {
        name: "1. Living in trees",
        text: "The Korowai tribe of Papua New Guinea live in treehouses high in the rainforest. The trees are strong and good for climbing. Their houses are about 8–15 metres above the ground. This protects them from animals and floods. They use a ladder to get up and build the houses from wood. Imagine the beautiful views from a treehouse!"
      },
      {
        name: "2. Living underground",
        text: "In Coober Pedy, Australia, many people live underground. The desert is very hot, but underground homes stay cool. About half of the people in the town live under the ground. You can find shops, hotels and even a church underground!"
      },
      {
        name: "3. Living on a volcano",
        text: "Aogashima is a small Japanese island with an active volcano. About 200 people live there. They are not worried about another eruption. The island has hot springs and beautiful nature. Tourists can take a boat trip from Tokyo to visit."
      },
      {
        name: "4. Living on the sea",
        text: "The Bajau people of Southeast Asia live on boats or in houses on stilts in the sea. They spend most of their lives on the water. Bajau children learn to swim and dive when they are very young. Some can dive very deep and stay underwater for a long time."
      },
      {
        name: "5. Living in caves",
        text: "Petra in Jordan is a famous place with houses and monuments cut into the rock. Long ago, people lived in these caves. Today tourists visit Petra to see the beautiful buildings. The government protects the area."
      }
    ]
  },

  functionalPhrases: [
    "One advantage of living in a treehouse is…",
    "A disadvantage is that…",
    "I would like / wouldn’t like to live there because…",
    "In my opinion, the most interesting place is…",
    "I prefer living in a normal house because…"
  ],

  exercises: {
    /* 4 vocabulary exercises */
    matching: {
      title: "Vocabulary 1 – Match the words",
      pairs: [
        { left: "treehouse", right: "a house built in a tree" },
        { left: "underground", right: "under the ground" },
        { left: "volcano", right: "a mountain that can explode" },
        { left: "cave", right: "a large hole in a mountain" },
        { left: "stilts", right: "long poles that hold a house up" },
        { left: "rainforest", right: "a thick hot wet forest" }
      ]
    },
    gapfill: {
      title: "Vocabulary 2 – Complete the sentences",
      words: ["advantage", "disadvantage", "protect", "ladder", "view", "tourist"],
      items: [
        { sentence: "One ______ of living underground is that it is cool in summer.", answer: "advantage" },
        { sentence: "A ______ of living in a treehouse is that it can be dangerous.", answer: "disadvantage" },
        { sentence: "The high houses ______ the Korowai from animals.", answer: "protect" },
        { sentence: "They use a ______ to climb into the treehouse.", answer: "ladder" },
        { sentence: "The ______ from the top of the tree is amazing.", answer: "view" },
        { sentence: "Many ______ visit Petra every year.", answer: "tourist" }
      ]
    },
    mcVocab: {
      title: "Vocabulary 3 – Choose the correct word",
      items: [
        { q: "The Bajau people live in houses on ______ in the sea.", options: ["stilts", "caves", "deserts"], answer: 0, hint: "Think about houses above the water." },
        { q: "Coober Pedy is in the ______. It is very dry and hot.", options: ["rainforest", "desert", "island"], answer: 1, hint: "A very dry place." },
        { q: "The Korowai are a ______ in Papua New Guinea.", options: ["tourist", "monument", "tribe"], answer: 2, hint: "A group of people with the same culture." },
        { q: "Petra has many old ______ cut into the rock.", options: ["volcanoes", "monuments", "ladders"], answer: 1, hint: "Important old buildings." }
      ]
    },
    dragdrop: {
      title: "Vocabulary 4 – Match place and description",
      items: [
        { sentence: "Korowai people → ______", options: ["treehouses", "caves", "boats"], answer: "treehouses" },
        { sentence: "Coober Pedy → ______", options: ["underground homes", "volcano", "stilts"], answer: "underground homes" },
        { sentence: "Bajau people → ______", options: ["houses on stilts", "desert", "rainforest"], answer: "houses on stilts" },
        { sentence: "Petra → ______", options: ["caves and monuments", "treehouses", "hot springs"], answer: "caves and monuments" }
      ]
    },

    /* other exercises */
    tf: {
      title: "Reading – True or False",
      items: [
        { q: "The Korowai build their houses high in the trees.", a: true, hint: "Read the first text about living in trees." },
        { q: "All people in Coober Pedy live underground.", a: false, hint: "Look for the word ‘half’." },
        { q: "Aogashima has about 200 people.", a: true, hint: "Find the number in the volcano text." },
        { q: "Bajau children learn to dive when they are old.", a: false, hint: "When do they learn to swim and dive?" }
      ]
    },
    order: {
      title: "Put the words in order",
      items: [
        { words: ["I", "would", "like", "to", "live", "in", "a", "treehouse"], answer: "I would like to live in a treehouse" },
        { words: ["One", "advantage", "is", "the", "beautiful", "view"], answer: "One advantage is the beautiful view" },
        { words: ["Living", "underground", "is", "cool", "in", "summer"], answer: "Living underground is cool in summer" }
      ]
    },
    mcReading: {
      title: "Reading – Choose the correct answer",
      items: [
        { q: "Why do the Korowai live in trees?", options: ["Because it is cheap", "To protect themselves from animals", "Because they like climbing"], answer: 1, hint: "Read the sentence with ‘protect’." },
        { q: "What is special about homes in Coober Pedy?", options: ["They are made of glass", "They are underground and stay cool", "They are on stilts"], answer: 1, hint: "Look at the underground text." },
        { q: "Where do the Bajau people live?", options: ["In caves", "On the sea", "In the desert"], answer: 1, hint: "Read the text about living on the sea." }
      ]
    }
  },

  speaking: {
    leadin: [
      { prompt: "Look at these places: treehouse, underground home, house on the sea, cave. Which one looks the most interesting? Why?", time: "1–2 min" },
      { prompt: "What are the advantages and disadvantages of living in a treehouse?", time: "1–2 min" }
    ],
    production: [
      {
        title: "Discussion cards (pairs)",
        cards: [
          "Which of the five places would you most like to visit? Why?",
          "Would you like to live in a treehouse for one month? What would be good and bad?",
          "Is it better to live in a traditional house or an unusual house? Give reasons.",
          "Invent a new unusual house (for example under the water or in the clouds). Describe it to your partner."

      },
      {
        title: "Role-play: Choose a home",
        roles: [
          { name: "Student A", text: "You want to live in a treehouse for a year. Tell your partner why. Talk about the advantages (view, nature, quiet). Answer their questions." },
          { name: "Student B", text: "You think living in a treehouse is a bad idea. Talk about the disadvantages (dangerous, difficult, far from shops). Try to change Student A’s mind." }

  summaryPoints: [
    "New words: treehouse, underground, volcano, stilts, rainforest, advantage, disadvantage…",
    "People live in many different kinds of houses around the world.",
    "Useful phrases: One advantage is… / A disadvantage is… / I would like to live…"

   APP LOGIC
   ============================================================ */
let currentStage = 0;
const totalStages = lessonData.stages.length;
const attempts = {};

function init() {
  renderNav();
  renderStages();
  showStage(0);
  updateProgress();
}

function renderNav() {
  const nav = document.getElementById("stageNav");
  nav.innerHTML = "";
  lessonData.stages.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.textContent = `${i+1}. ${s.name}`;
    btn.onclick = () => showStage(i);
    nav.appendChild(btn);
  });
}

function renderStages() {
  const c = document.getElementById("stagesContainer");

function shell(idx) {
  const s = lessonData.stages[idx];
  const div = document.createElement("div");

  div.innerHTML = `<div class="stage-header"><h2>${s.name}</h2><div class="aim"><strong>Aim:</strong> ${s.aim}</div><span class="time">⏱ ${s.time}</span></div>`;
  return div;
}

/* NAV */
function showStage(idx) {
  currentStage = idx;
  document.querySelectorAll(".stage").forEach((el, i) => el.classList.toggle("active", i === idx));
  document.querySelectorAll("#stageNav button").forEach((btn, i) => {
    btn.classList.toggle("active", i === idx);
    if (i < idx) btn.classList.add("done");
  });
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").textContent = idx === totalStages - 1 ? "Finish" : "Next →";
  updateProgress();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function changeStage(d) {
  const n = currentStage + d;
  if (n >= 0 && n < totalStages) showStage(n);
}
function updateProgress() {
  document.getElementById("progressBar").style.width = ((currentStage + 1) / totalStages * 100) + "%";
}
function restartLesson() {
  if (confirm("Start the lesson again?")) location.reload();
}

/* MATCHING */
let matchSelected = null, matchLeft = 0;
function buildMatching() {
  const grid = document.getElementById("matchGrid");
  if (!grid) return;
  const pairs = lessonData.exercises.matching.pairs;
  matchLeft = pairs.length;
  const lefts = pairs.map((p, i) => ({ text: p.left, id: i, type: "L" }));
  const rights = pairs.map((p, i) => ({ text: p.right, id: i, type: "R" }));
  for (let i = rights.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rights[i], rights[j]] = [rights[j], rights[i]];
  }
  grid.innerHTML = "";
  [...lefts, ...rights].forEach(item => {
    const el = document.createElement("div");
    el.className = "match-item";
    el.textContent = item.text;
    el.dataset.id = item.id;
    el.dataset.type = item.type;
    el.onclick = () => onMatch(el);
    grid.appendChild(el);
  });
}
function onMatch(el) {
  if (el.classList.contains("matched")) return;
  if (!matchSelected) { matchSelected = el; el.classList.add("selected"); return; }
  if (matchSelected === el) { el.classList.remove("selected"); matchSelected = null; return; }
  if (matchSelected.dataset.type === el.dataset.type) {
    matchSelected.classList.remove("selected"); matchSelected = el; el.classList.add("selected"); return;
  }
  if (matchSelected.dataset.id === el.dataset.id) {
    matchSelected.classList.remove("selected");
    matchSelected.classList.add("matched");
    el.classList.add("matched");
    matchSelected = null;
    matchLeft--;
    if (matchLeft === 0) {
      document.getElementById("fb-match").className = "feedback correct";
      document.getElementById("fb-match").textContent = "✓ Excellent!";
    }
  } else {
    matchSelected.classList.add("wrong-temp");
    el.classList.add("wrong-temp");
    setTimeout(() => {
      matchSelected.classList.remove("selected", "wrong-temp");
      el.classList.remove("wrong-temp");
      matchSelected = null;
    }, 500);
  }
}
function resetMatch() {
  matchSelected = null;
  buildMatching();
  document.getElementById("fb-match").style.display = "none";
}

/* GAP */
function checkGap(i) {
  const key = "gap" + i;
  attempts[key] = (attempts[key] || 0) + 1;
  const input = document.getElementById("gap-" + i);
  const user = input.value.trim().toLowerCase();
  const correct = input.dataset.answer.toLowerCase();
  const fb = document.getElementById("fb-gap-" + i);
  if (user === correct) {
    fb.className = "feedback correct";
    fb.textContent = "✓ Correct!";
    document.getElementById("show-gap-" + i).classList.add("hidden");
  } else {
    fb.className = "feedback wrong";
    fb.textContent = "✗ Try again.";
    if (attempts[key] >= 2) document.getElementById("show-gap-" + i).classList.remove("hidden");
    else {
      fb.className = "feedback hint";
      fb.textContent = "Hint: Look at the word bank.";
    }
  }
}

/* TF */
function selTF(btn) {
  const i = btn.dataset.i;
  btn.parentElement.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("selected-true", "selected-false"));
  btn.classList.add(btn.dataset.v === "true" ? "selected-true" : "selected-false");
  document.getElementById("btns-tf-" + i).style.display = "flex";
}
function checkTF(i) {
  const key = "tf" + i;
  attempts[key] = (attempts[key] || 0) + 1;
  const parent = document.getElementById("fb-tf-" + i).previousElementSibling;
  const selected = parent.querySelector(".selected-true, .selected-false");
  if (!selected) return;
  const user = selected.dataset.v === "true";
  const correct = lessonData.exercises.tf.items[i].a;
  const fb = document.getElementById("fb-tf-" + i);
  if (user === correct) {
    fb.className = "feedback correct";
    fb.textContent = "✓ Correct!";
    document.getElementById("show-tf-" + i).classList.add("hidden");
  } else {
    fb.className = "feedback wrong";
    fb.textContent = "✗ Not quite.";
    if (attempts[key] >= 2) document.getElementById("show-tf-" + i).classList.remove("hidden");
    else {
      fb.className = "feedback hint";
      fb.textContent = "Hint: " + lessonData.exercises.tf.items[i].hint;
    }
  }
}

/* MC */
function selMC(btn) {
  const i = btn.dataset.i;
  const ex = btn.dataset.ex;
  document.querySelectorAll(`.mc-option[data-ex="${ex}"][data-i="${i}"]`).forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}
function checkMC(ex, i) {
  const key = ex + i;
  attempts[key] = (attempts[key] || 0) + 1;
  const sel = document.querySelector(`.mc-option[data-ex="${ex}"][data-i="${i}"].selected`);
  if (!sel) return;
  const oi = +sel.dataset.oi;
  let correct, hint, options;
  if (ex === "mcv") {
    correct = lessonData.exercises.mcVocab.items[i].answer;
    hint = lessonData.exercises.mcVocab.items[i].hint;
    options = lessonData.exercises.mcVocab.items[i].options;
  } else {
    correct = lessonData.exercises.mcReading.items[i].answer;
    hint = lessonData.exercises.mcReading.items[i].hint;
    options = lessonData.exercises.mcReading.items[i].options;
  }
  const fb = document.getElementById(`fb-${ex}-${i}`);
  if (oi === correct) {
    fb.className = "feedback correct";
    fb.textContent = "✓ Correct!";
    sel.classList.add("correct-ans");
    document.getElementById(`show-${ex}-${i}`).classList.add("hidden");
  } else {
    fb.className = "feedback wrong";
    fb.textContent = "✗ Try again.";
    if (attempts[key] >= 2) document.getElementById(`show-${ex}-${i}`).classList.remove("hidden");
    else {
      fb.className = "feedback hint";
      fb.textContent = "Hint: " + hint;
    }
  }
}

/* ORDER */
const orderState = {};
function buildOrderBanks() {
  lessonData.exercises.order.items.forEach((item, i) => {
    const bank = document.getElementById("order-bank-" + i);
    if (!bank) return;
    orderState[i] = [];
    const words = [...item.words];
    for (let k = words.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [words[k], words[j]] = [words[j], words[k]];
    }
    words.forEach(w => {
      const el = document.createElement("span");
      el.className = "order-word";
      el.textContent = w;
      el.dataset.word = w;
      el.onclick = () => addOrderWord(i, el);
      bank.appendChild(el);
    });
  });
}
function addOrderWord(i, el) {
  if (el.classList.contains("used")) return;
  el.classList.add("used");
  orderState[i].push(el.dataset.word);
  const sent = document.getElementById("order-sent-" + i);
  const chip = document.createElement("span");
  chip.className = "order-word";
  chip.textContent = el.dataset.word;
  chip.style.background = "var(--green)";
  chip.style.color = "white";
  chip.onclick = () => {
    const idx = orderState[i].lastIndexOf(el.dataset.word);
    if (idx > -1) orderState[i].splice(idx, 1);
    chip.remove();
    el.classList.remove("used");
  };
  sent.appendChild(chip);
}
function checkOrder(i) {
  const key = "order" + i;
  attempts[key] = (attempts[key] || 0) + 1;
  const user = orderState[i].join(" ");
  const correct = lessonData.exercises.order.items[i].answer;
  const fb = document.getElementById("fb-order-" + i);
  if (user === correct) {
    fb.className = "feedback correct";
    fb.textContent = "✓ Perfect!";
    document.getElementById("show-order-" + i).classList.add("hidden");
  } else {
    fb.className = "feedback wrong";
    fb.textContent = "✗ Not quite.";
    if (attempts[key] >= 2) document.getElementById("show-order-" + i).classList.remove("hidden");
    else {
      fb.className = "feedback hint";
      fb.textContent = "Hint: Start with I / One / Living…";
    }
  }
}
function resetOrder(i) {
  orderState[i] = [];
  document.getElementById("order-sent-" + i).innerHTML = "";
  document.getElementById("order-bank-" + i).querySelectorAll(".order-word").forEach(w => w.classList.remove("used"));
  document.getElementById("fb-order-" + i).style.display = "none";
  document.getElementById("show-order-" + i).classList.add("hidden");
}

/* DRAG DROP */
function buildDragItems() {
  lessonData.exercises.dragdrop.items.forEach((item, i) => {
    const zone = document.getElementById("drag-zone-" + i);
    if (!zone) return;
    const opts = [...item.options];
    for (let k = opts.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [opts[k], opts[j]] = [opts[j], opts[k]];
    }
    opts.forEach(o => {
      const el = document.createElement("div");
      el.className = "drag-item";
      el.textContent = o;
      el.draggable = true;
      el.dataset.value = o;
      el.ondragstart = e => { e.dataTransfer.setData("text/plain", o); el.classList.add("dragging"); };
      el.ondragend = () => el.classList.remove("dragging");
      el.addEventListener("touchstart", handleTouchStart, { passive: false });
      el.addEventListener("touchmove", handleTouchMove, { passive: false });
      el.addEventListener("touchend", handleTouchEnd, { passive: false });
      zone.appendChild(el);
    });
  });
}
function allowDrop(e) { e.preventDefault(); }
function drop(e, i) {
  e.preventDefault();
  const val = e.dataTransfer.getData("text/plain");
  const slot = document.getElementById("drop-" + i);
  slot.innerHTML = "";
  const chip = document.createElement("div");
  chip.className = "drag-item";
  chip.textContent = val;
  chip.dataset.value = val;
  slot.appendChild(chip);
  slot.classList.add("filled");
}
function checkDD(i) {
  const key = "dd" + i;
  attempts[key] = (attempts[key] || 0) + 1;
  const slot = document.getElementById("drop-" + i);
  const chip = slot.querySelector(".drag-item");
  const fb = document.getElementById("fb-dd-" + i);
  if (!chip) { fb.className = "feedback hint"; fb.textContent = "Drag a word first."; return; }
  if (chip.dataset.value === slot.dataset.answer) {
    fb.className = "feedback correct";
    fb.textContent = "✓ Correct!";
    document.getElementById("show-dd-" + i).classList.add("hidden");
  } else {
    fb.className = "feedback wrong";
    fb.textContent = "✗ Try another.";
    if (attempts[key] >= 2) document.getElementById("show-dd-" + i).classList.remove("hidden");
    else {
      fb.className = "feedback hint";
      fb.textContent = "Hint: Think which place matches the description.";
    }
  }
}

let touchItem = null, touchClone = null;
function handleTouchStart(e) {
  touchItem = e.target.closest(".drag-item");
  if (!touchItem) return;
  e.preventDefault();
  touchClone = touchItem.cloneNode(true);
  touchClone.style.cssText = "position:fixed;z-index:9999;opacity:0.85;pointer-events:none;";
  document.body.appendChild(touchClone);
  const t = e.touches[0];
  touchClone.style.left = (t.clientX - 40) + "px";
  touchClone.style.top = (t.clientY - 20) + "px";
}
function handleTouchMove(e) {
  if (!touchClone) return;
  e.preventDefault();
  const t = e.touches[0];
  touchClone.style.left = (t.clientX - 40) + "px";
  touchClone.style.top = (t.clientY - 20) + "px";
}
function handleTouchEnd(e) {
  if (!touchClone || !touchItem) return;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const slot = el ? el.closest(".drop-slot") : null;
  if (slot) {
    slot.innerHTML = "";
    const chip = document.createElement("div");
    chip.className = "drag-item";
    chip.textContent = touchItem.dataset.value;
    chip.dataset.value = touchItem.dataset.value;
    slot.appendChild(chip);
    slot.classList.add("filled");
  }
  touchClone.remove();
  touchClone = null;
  touchItem = null;
}

/* SHOW ANSWER */
function showAns(type, i) {
  if (type === "gap") {
    document.getElementById("gap-" + i).value = lessonData.exercises.gapfill.items[i].answer;
    document.getElementById("fb-gap-" + i).className = "feedback correct";
    document.getElementById("fb-gap-" + i).textContent = "Answer: " + lessonData.exercises.gapfill.items[i].answer;
  } else if (type === "tf") {
    const a = lessonData.exercises.tf.items[i].a ? "True" : "False";
    document.getElementById("fb-tf-" + i).className = "feedback correct";
    document.getElementById("fb-tf-" + i).textContent = "Answer: " + a;
  } else if (type === "mcv") {
    const ans = lessonData.exercises.mcVocab.items[i].answer;
    document.getElementById("fb-mcv-" + i).className = "feedback correct";
    document.getElementById("fb-mcv-" + i).textContent = "Answer: " + lessonData.exercises.mcVocab.items[i].options[ans];
    document.querySelectorAll(`.mc-option[data-ex="mcv"][data-i="${i}"]`)[ans].classList.add("correct-ans");
  } else if (type === "mcr") {
    const ans = lessonData.exercises.mcReading.items[i].answer;
    document.getElementById("fb-mcr-" + i).className = "feedback correct";
    document.getElementById("fb-mcr-" + i).textContent = "Answer: " + lessonData.exercises.mcReading.items[i].options[ans];
    document.querySelectorAll(`.mc-option[data-ex="mcr"][data-i="${i}"]`)[ans].classList.add("correct-ans");
  } else if (type === "order") {
    document.getElementById("fb-order-" + i).className = "feedback correct";
    document.getElementById("fb-order-" + i).textContent = "Answer: " + lessonData.exercises.order.items[i].answer;
  } else if (type === "dd") {
    const text = lessonData.exercises.dragdrop.items[i].answer;
    const slot = document.getElementById("drop-" + i);
    slot.innerHTML = "";
    const chip = document.createElement("div");
    chip.className = "drag-item";
    chip.textContent = text;
    slot.appendChild(chip);
    slot.classList.add("filled");
    document.getElementById("fb-dd-" + i).className = "feedback correct";
    document.getElementById("fb-dd-" + i).textContent = "Answer: " + text;
  }
}
